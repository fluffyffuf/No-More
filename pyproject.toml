[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomore"
version = "0.1.0"
description = "NOMORE — Next-Generation Web Security & OSINT CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.scripts]
nomore = "nomore.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["nomore"]
