    <path d="M134 74H153L179 148H160L146 117L132 148H113L134 74Z" fill="#F8FAFC" opacity="0.92"/>
    <path d="M90 42C104 30 120 24 136 24C154 24 170 30 182 42" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g>
    <text x="276" y="105" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="7">NOMORE</text>
    <text x="282" y="145" fill="#0F766E" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">SAFE • SCOPE • EVIDENCE</text>
    <path d="M280 161H622" stroke="#10B981" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
