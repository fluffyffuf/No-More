<svg width="760" height="220" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NOMORE logo</title>
  <desc id="desc">A modern shield-inspired logo for the NOMORE project.</desc>
  <defs>
    <linearGradient id="shieldGradient" x1="30" y1="20" x2="220" y2="185" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="52" y1="40" x2="196" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="159" y1="35" x2="83" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.24"/>
    </filter>
